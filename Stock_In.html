<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a7f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Cafe Stock - إدخال المخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.png" alt="شعار الكافيه" class="logo">
            <h1>إدخال مخزون الكافيه</h1>
            <p id="employeeWelcome" class="employee-welcome" style="color: #1a7f8b; font-weight: 600; margin-top: 5px; font-size: 1rem;"></p>
        </div>
        
        <form id="stockForm">
            <div class="form-group">
                <label for="date">التاريخ:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="projectName">اسم المشروع:</label>
                <select id="projectName" name="projectName" required>
                    <option value="">جاري التحميل...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="product">المنتج:</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="barcode-input-container">
                        <input type="text" id="barcodeInput" placeholder="امسح أو أدخل الباركود">
                        <button type="button" onclick="startBarcodeScanner()" class="camera-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 15.2c-2.1 0-3.8-1.7-3.8-3.8s1.7-3.8 3.8-3.8 3.8 1.7 3.8 3.8-1.7 3.8-3.8 3.8zm0-6.6c-1.5 0-2.8 1.3-2.8 2.8s1.3 2.8 2.8 2.8 2.8-1.3 2.8-2.8-1.3-2.8-2.8-2.8z"/>
                                <path d="M20 19H4c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h3.2l1.8-2h6l1.8 2H20c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2zM4 6c-.6 0-1 .4-1 1v10c0 .6.4 1 1 1h16c.6 0 1-.4 1-1V7c0-.6-.4-1-1-1h-3.8l-1.8-2h-5l-1.8 2H4z"/>
                            </svg>
                        </button>
                    </div>
                    <button type="button" onclick="searchByBarcode()" style="flex: 0.5; background: linear-gradient(135deg, #024069, #2980b9); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 80px; padding: 12px 8px;">بحث</button>
                </div>
                <input type="text" id="productSearchInput" placeholder="🔍 ابحث عن منتج بالاسم..." style="width: 100%; padding: 10px; border: 2px solid #20B2AA; border-radius: 8px; margin-bottom: 10px; font-family: 'Cairo', sans-serif; font-size: 16px;">
                <select id="product" name="product" required>
                    <option value="">جاري التحميل...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">الكمية والوحدة:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="quantity" name="quantity" placeholder="أدخل الكمية" min="1" required style="flex: 2;">
                    <input type="text" id="unit" name="unit" placeholder="الوحدة" readonly style="flex: 1; background-color: #f8f9fa; color: #6c757d;">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-add" onclick="addProduct()">إضافة منتج</button>
                <button type="button" class="btn-clear" onclick="clearForm()">مسح</button>
                <button type="button" class="btn-back" onclick="window.location.href='home.html'">الرجوع</button>
            </div>

            <!-- قائمة المنتجات المضافة -->
            <div id="addedProductsList" class="added-products-list" style="display: none;">
                <h3>المنتجات المدخلة:</h3>
                <div id="productsContainer"></div>
                <div class="send-button-container">
                    <button type="button" class="btn-send" onclick="sendToGoogleSheets()">📥 إرسال جميع البيانات</button>
                    <button type="button" class="btn-clear-all" onclick="clearAllProducts()">مسح الكل</button>
                </div>
            </div>

            <div id="successMessage" class="success-message">
                تم حفظ البيانات بنجاح!
            </div>
        </form>
    </div>

    <!-- واجهة ماسح الباركود -->
    <div id="barcodeScanner" class="barcode-scanner">
        <div class="scanner-container">
            <div class="scanner-header">
                <h3>📷 ماسح الباركود</h3>
                <p>وجه الكاميرا نحو الباركود</p>
            </div>
            
            <div class="scanner-video" id="scannerVideo">
                <div class="scan-overlay"></div>
                <div class="scan-corners"></div>
                <div class="scan-line"></div>
            </div>
            
            <div class="scanner-controls">
                <button class="scanner-btn btn-close-scanner" onclick="stopBarcodeScanner()">
                    إغلاق
                </button>
                <button class="scanner-btn btn-toggle-flash" onclick="toggleFlash()">
                    💡 فلاش
                </button>
            </div>
            
            <div style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
                <p>💡 تأكد من وضوح الباركود في المنطقة المحددة</p>
            </div>
        </div>
    </div>

    <!-- شريط التحميل الاحترافي -->
    <div id="loadingBar" class="loading-bar-overlay" style="display:none;">
        <div class="loading-bar-container">
            <div class="loading-bar-spinner"></div>
            <div class="loading-bar-text">جاري تحميل البيانات...</div>
        </div>
    </div>

    <!-- نافذة الخطأ المنبثقة -->
    <div id="errorModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>خطأ في الربط مع Google Sheets</h2>
            <p>لم يتم تعيين رابط Google Apps Script.<br>يرجى الذهاب إلى صفحة الإعدادات أولاً.</p>
            <button onclick="window.location.href='home.html'" class="btn-back-modal">الرجوع للصفحة الرئيسية</button>
        </div>
    </div>
    <script>
        // جلب رابط Google Apps Script من config.json وتخزينه في localStorage إذا لم يكن موجوداً
        window.addEventListener('DOMContentLoaded', async function() {
            if (!localStorage.getItem('googleAppsScriptUrl')) {
                try {
                    const res = await fetch('config.json');
                    const config = await res.json();
                    if (config.googleAppsScriptUrl) {
                        localStorage.setItem('googleAppsScriptUrl', config.googleAppsScriptUrl);
                    }
                } catch (e) {
                    console.error('فشل في جلب إعدادات Google Apps Script من config.json:', e);
                }
            }
        });
        // تعيين التاريخ الحالي تلقائياً
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // متغيرات عامة
        let productsData = [];
        let scannerActive = false;
        let flashEnabled = false;
        let addedProducts = []; // قائمة المنتجات المضافة

        // تحميل المشاريع من Google Sheets
        async function loadProjects() {
            const projectSelect = document.getElementById('projectName');
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                if (!GOOGLE_SCRIPT_URL) {
                    showErrorModal();
                    return;
                }
                projectSelect.innerHTML = '<option value="">جاري التحميل...</option>';
                const response = await fetch(GOOGLE_SCRIPT_URL + '?type=stock_out_projects');
                const result = await response.json();
                if (result.success && result.data) {
                    projectSelect.innerHTML = '<option value="">اختر المشروع</option>';
                    result.data.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project;
                        option.textContent = project;
                        projectSelect.appendChild(option);
                    });
                    console.log(`تم تحميل ${result.count} مشروع بنجاح`);
                } else {
                    throw new Error(result.error || 'فشل في تحميل بيانات المشاريع من Stock_Out');
                }
            } catch (error) {
                console.error('خطأ في تحميل المشاريع:', error);
                handleLoadError(projectSelect, error, 'المشاريع');
            }
        }

        // تحميل المنتجات من Google Sheets بناءً على المشروع المحدد
        // دوال إظهار/إخفاء شريط التحميل
        function showLoadingBar() {
            document.getElementById('loadingBar').style.display = 'flex';
        }
        function hideLoadingBar() {
            document.getElementById('loadingBar').style.display = 'none';
        }

        // دوال إظهار نافذة الخطأ المنبثقة
        function showErrorModal() {
            document.getElementById('errorModal').style.display = 'flex';
        }
        function hideErrorModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        async function loadProducts(projectName = null) {
            const productSelect = document.getElementById('product');
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                if (!GOOGLE_SCRIPT_URL) {
                    showErrorModal();
                    return;
                }
                showLoadingBar();
                let url;
                if (projectName) {
                    url = GOOGLE_SCRIPT_URL + `?type=stock_out_products&project=${encodeURIComponent(projectName)}`;
                } else {
                    url = GOOGLE_SCRIPT_URL + '?type=products';
                }
                const response = await fetch(url);
                const result = await response.json();
                if (result.success && result.data) {
                    productsData = result.data;
                    productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                    result.data.forEach(product => {
                        const option = document.createElement('option');
                        option.value = product.name;
                        option.textContent = product.name;
                        option.dataset.barcode = product.barcode || '';
                        option.dataset.unit = product.unit || 'قطعة';
                        productSelect.appendChild(option);
                    });
                    console.log(`تم تحميل ${result.count} منتج بنجاح${projectName ? ` للمشروع: ${projectName}` : ''}`);
                } else {
                    throw new Error(result.error || 'فشل في تحميل بيانات المنتجات');
                }
            } catch (error) {
                console.error('خطأ في تحميل المنتجات:', error);
                handleLoadError(productSelect, error, 'المنتجات');
            } finally {
                hideLoadingBar();
            }
        }

        // البحث عن منتج بالباركود
        async function searchByBarcode() {
            const barcodeInput = document.getElementById('barcodeInput');
            const productSelect = document.getElementById('product');
            const barcode = barcodeInput.value.trim();
            
            if (!barcode) {
                alert('يرجى إدخال الباركود أولاً');
                return;
            }

            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('لم يتم تعيين رابط Google Apps Script.');
                }
                
                // البحث في البيانات المحلية أولاً (المنتجات المفلترة)
                const localProduct = productsData.find(p => p.barcode === barcode);
                if (localProduct) {
                    // تحديد المنتج في القائمة
                    productSelect.value = localProduct.name;
                    // تحديث الوحدة
                    document.getElementById('unit').value = localProduct.unit || 'قطعة';
                    showMessage('success', `تم العثور على المنتج: ${localProduct.name}`);
                    return;
                }

                // البحث في جميع المنتجات في شيت Products
                const response = await fetch(GOOGLE_SCRIPT_URL + `?type=search&barcode=${encodeURIComponent(barcode)}`);
                const result = await response.json();
                
                if (result.success && result.found) {
                    // التحقق من وجود المنتج في القائمة المفلترة
                    const productExistsInList = productsData.some(p => p.name === result.data.name);
                    
                    if (productExistsInList) {
                        // تحديد المنتج في القائمة
                        productSelect.value = result.data.name;
                        // تحديث الوحدة من Stock_Out
                        const projectName = document.getElementById('projectName').value;
                        if (projectName) {
                            await updateUnitFromStockOut(projectName, result.data.name);
                        }
                        showMessage('success', `تم العثور على المنتج: ${result.data.name}`);
                    } else {
                        showMessage('error', `المنتج "${result.data.name}" غير متاح لهذا المشروع`);
                    }
                    
                    // إضافة المنتج للبيانات المحلية إذا لم يكن موجوداً
                    if (!productsData.find(p => p.barcode === result.data.barcode)) {
                        productsData.push(result.data);
                        
                        // إضافة خيار جديد للقائمة
                        const option = document.createElement('option');
                        option.value = result.data.name;
                        option.textContent = result.data.name;
                        option.dataset.barcode = result.data.barcode;
                        option.dataset.unit = result.data.unit || 'قطعة';
                        productSelect.appendChild(option);
                        productSelect.value = result.data.name;
                        
                        // تحديث الوحدة من Stock_Out إذا كان هناك مشروع محدد
                        const projectName = document.getElementById('projectName').value;
                        if (projectName) {
                            await updateUnitFromStockOut(projectName, result.data.name);
                        } else {
                            document.getElementById('unit').value = result.data.unit || 'قطعة';
                        }
                    }
                } else {
                    showMessage('error', `❌ ${result.message || 'لم يتم العثور على منتج بهذا الباركود'}`);
                }
                
            } catch (error) {
                console.error('خطأ في البحث:', error);
                showMessage('error', `❌ خطأ في البحث: ${error.message}`);
            } finally {
                // مسح حقل الباركود
                barcodeInput.value = '';
            }
        }

        // تحديث الوحدة من شيت Stock_Out بناءً على المشروع والمنتج
        async function updateUnitFromStockOut(projectName, productName) {
            try {
                // الحصول على الرابط المحفوظ من الإعدادات
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('لم يتم تعيين رابط Google Apps Script.');
                }
                
                // استدعاء Google Apps Script للحصول على الوحدة من Stock_Out
                const response = await fetch(GOOGLE_SCRIPT_URL + `?type=stock_out_unit&project=${encodeURIComponent(projectName)}&product=${encodeURIComponent(productName)}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    // تحديث حقل الوحدة من عمود D و E (الكمية + الوحدة)
                    const displayText = `${result.data.quantity || ''} ${result.data.unit || 'قطعة'}`.trim();
                    document.getElementById('unit').value = displayText;
                    console.log(`تم تحديث الوحدة للمنتج "${productName}" في المشروع "${projectName}": ${displayText}`);
                } else {
                    throw new Error(result.error || 'فشل في الحصول على بيانات الوحدة من Stock_Out');
                }
                
            } catch (error) {
                console.error('خطأ في تحديث الوحدة:', error);
                // في حالة الخطأ، استخدم قيمة افتراضية
                document.getElementById('unit').value = 'قطعة';
                showMessage('error', `خطأ في تحديث الوحدة: ${error.message}`);
            }
        }

        // معالجة أخطاء التحميل
        function handleLoadError(selectElement, error, dataType) {
            selectElement.innerHTML = `
                <option value="">خطأ في تحميل ${dataType}</option>
                <option value="عنصر تجريبي">عنصر تجريبي</option>
            `;
            
            // إضافة رسالة خطأ مع رابط للإعدادات
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = `
                <div style="background: #ffebee; border: 2px solid #f44336; border-radius: 8px; padding: 15px; margin-top: 15px; color: #c62828; text-align: center;">
                    <strong>خطأ في تحميل ${dataType} من Stock_Out:</strong><br>
                    ${error.message}<br>
                    <small>تأكد من اختيار مشروع صحيح أولاً</small><br>
                    <a href="0541.html" style="color: #1976d2; text-decoration: underline; font-weight: bold;">
                        🔧 اذهب إلى صفحة الإعدادات
                    </a>
                </div>
            `;
            
            selectElement.parentNode.appendChild(errorDiv);
        }

        // إظهار الرسائل
        function showMessage(type, text) {
            // إزالة الرسائل السابقة
            const existingMessages = document.querySelectorAll('.temp-message');
            existingMessages.forEach(msg => msg.remove());
            
            // إنشاء رسالة جديدة
            const messageDiv = document.createElement('div');
            messageDiv.className = 'temp-message';
            
            let bgColor, textColor, borderColor;
            switch(type) {
                case 'success':
                    bgColor = 'linear-gradient(135deg, #E0F8F8, #B8E6E6)';
                    textColor = '#1A7A73';
                    borderColor = '#20B2AA';
                    break;
                case 'error':
                    bgColor = 'linear-gradient(135deg, #ffebee, #ffcdd2)';
                    textColor = '#c62828';
                    borderColor = '#f44336';
                    break;
                case 'info':
                    bgColor = 'linear-gradient(135deg, #e3f2fd, #bbdefb)';
                    textColor = '#1565c0';
                    borderColor = '#2196f3';
                    break;
                default:
                    bgColor = 'linear-gradient(135deg, #E0F8F8, #B8E6E6)';
                    textColor = '#1A7A73';
                    borderColor = '#20B2AA';
            }
            
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                font-weight: bold;
                z-index: 1000;
                max-width: 400px;
                font-family: 'Cairo', sans-serif;
                background: ${bgColor};
                color: ${textColor};
                border: 2px solid ${borderColor};
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                animation: slideIn 0.3s ease-out;
            `;
            messageDiv.textContent = text;
            
            document.body.appendChild(messageDiv);
            
            // إخفاء الرسالة بعد 4 ثواني
            setTimeout(() => {
                messageDiv.remove();
            }, 4000);
        }

        // تحميل البيانات عند تحميل الصفحة
        window.addEventListener('load', function() {
            loadProjects();
            // loadProducts(); // سيتم تحميل المنتجات عند اختيار المشروع
        });

        // تحديث الوحدة عند اختيار منتج من القائمة
        document.getElementById('product').addEventListener('change', async function() {
            const selectedOption = this.options[this.selectedIndex];
            const selectedProduct = selectedOption.value;
            const projectName = document.getElementById('projectName').value;
            
            if (selectedProduct && projectName) {
                // الحصول على الوحدة من Stock_Out للمشروع والمنتج المحدد
                await updateUnitFromStockOut(projectName, selectedProduct);
            } else {
                // مسح حقل الوحدة إذا لم يتم اختيار منتج أو مشروع
                document.getElementById('unit').value = '';
            }
        });

        // تحديث المنتجات عند تغيير المشروع
        document.getElementById('projectName').addEventListener('change', function() {
            const selectedProject = this.value;
            if (selectedProject) {
                loadProducts(selectedProject);
            } else {
                // إذا لم يتم اختيار مشروع، مسح قائمة المنتجات
                const productSelect = document.getElementById('product');
                productSelect.innerHTML = '<option value="">اختر مشروعاً أولاً</option>';
                productsData = [];
            }
        });

        // معالج إرسال النموذج - تم إلغاؤه لصالح نظام الإضافة
        // document.getElementById('stockForm').addEventListener('submit', function(e) {
        //     e.preventDefault();
        //     addProduct(); // استبدال بدالة إضافة المنتج
        // });

        // دالة إضافة منتج جديد
        function addProduct() {
            // الحصول على البيانات
            const date = document.getElementById('date').value;
            const projectName = document.getElementById('projectName').value;
            const product = document.getElementById('product').value;
            const quantity = document.getElementById('quantity').value;
            const unit = document.getElementById('unit').value;
            
            // التحقق من البيانات
            if (!date) {
                alert('يرجى تحديد التاريخ');
                return;
            }
            
            if (!projectName) {
                alert('يرجى اختيار اسم المشروع');
                return;
            }
            
            if (!product) {
                alert('يرجى اختيار المنتج');
                return;
            }
            
            if (!quantity || quantity <= 0) {
                alert('يرجى إدخال كمية صحيحة');
                return;
            }
            
            // الحصول على اسم الموظف من sessionStorage
            const employeeName = sessionStorage.getItem('employeeName') || 'غير محدد';
            
            // إنشاء كائن المنتج
            const productItem = {
                id: Date.now(), // معرف فريد
                date: date,
                projectName: projectName,
                product: product,
                quantity: quantity,
                unit: unit || 'قطعة',
                timestamp: new Date().toISOString(),
                employeeName: employeeName
            };
            
            // إضافة المنتج للقائمة
            addedProducts.push(productItem);
            
            // تحديث العرض
            updateProductsList();
            
            // مسح بيانات المنتج والكمية فقط
            clearProductFields();
            
            // إظهار رسالة نجاح
            showMessage('success', 'تم إضافة المنتج بنجاح!');
        }

        // دالة تحديث قائمة المنتجات المعروضة
        function updateProductsList() {
            const listContainer = document.getElementById('addedProductsList');
            const productsContainer = document.getElementById('productsContainer');
            
            if (addedProducts.length === 0) {
                listContainer.style.display = 'none';
                return;
            }
            
            listContainer.style.display = 'block';
            productsContainer.innerHTML = '';
            
            addedProducts.forEach((item, index) => {
                const productDiv = document.createElement('div');
                productDiv.className = 'product-item';
                productDiv.innerHTML = `
                    <div class="product-info">
                        <div class="product-name">${item.product}</div>
                        <div class="product-details">الكمية: ${item.quantity} ${item.unit}</div>
                        <div class="product-employee" style="display: none;">${item.employeeName || 'غير محدد'}</div>
                    </div>
                    <button class="remove-btn" onclick="removeProduct(${item.id})" title="حذف المنتج">حذف</button>
                `;
                productsContainer.appendChild(productDiv);
            });
        }

        // دالة حذف منتج من القائمة
        function removeProduct(productId) {
            addedProducts = addedProducts.filter(item => item.id !== productId);
            updateProductsList();
            showMessage('success', 'تم حذف المنتج');
        }

        // دالة مسح جميع المنتجات
        function clearAllProducts() {
            if (addedProducts.length === 0) {
                alert('لا توجد منتجات للحذف');
                return;
            }
            
            if (confirm('هل أنت متأكد من حذف جميع المنتجات؟')) {
                addedProducts = [];
                updateProductsList();
                showMessage('success', 'تم حذف جميع المنتجات');
            }
        }

        // دالة مسح حقول المنتج والكمية فقط
        function clearProductFields() {
            document.getElementById('product').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('barcodeInput').value = '';
            // إذا كان حقل البحث فارغ، أظهر كل المنتجات في القائمة المنسدلة
            const barcodeInput = document.getElementById('barcodeInput');
            const productSelect = document.getElementById('product');
            if (!barcodeInput.value.trim()) {
                productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                productsData.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.name;
                    option.textContent = product.name;
                    option.dataset.barcode = product.barcode || '';
                    option.dataset.unit = product.unit || 'قطعة';
                    productSelect.appendChild(option);
                });
            }
        }

        // دالة إرسال البيانات إلى Google Sheets
        async function sendToGoogleSheets() {
            // ==================== كود التشخيص ====================
            console.log('='.repeat(60));
            console.log('🔍 بدء تشخيص المشكلة:');
            console.log('1️⃣ اسم الموظف في sessionStorage:', sessionStorage.getItem('employeeName'));
            console.log('2️⃣ عدد المنتجات:', addedProducts.length);
            console.log('3️⃣ بيانات المنتجات:');
            addedProducts.forEach((item, index) => {
                console.log(`   منتج #${index + 1}:`, {
                    product: item.product,
                    quantity: item.quantity,
                    employeeName: item.employeeName,
                    hasEmployeeName: !!item.employeeName,
                    employeeNameValue: item.employeeName || 'غير موجود'
                });
            });
            console.log('='.repeat(60));
            // ==================== نهاية التشخيص ====================
            
            if (addedProducts.length === 0) {
                alert('يرجى إضافة منتجات أولاً');
                return;
            }
            showLoadingBar(); // إظهار شريط التحميل
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('لم يتم تعيين رابط Google Apps Script. يرجى الذهاب إلى صفحة الإعدادات أولاً.');
                }
                
                // التحقق من صحة الرابط
                if (!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
                    throw new Error('رابط Google Apps Script غير صحيح. يجب أن يحتوي على script.google.com');
                }
                
                // إظهار رسالة التحميل
                showMessage('info', '📥 جاري إرسال البيانات...');
                
                console.log('🚀 ========== بدء الإرسال ==========');
                console.log('📊 عدد المنتجات:', addedProducts.length);
                
                let successCount = 0;
                let failedCount = 0;
                
                // إرسال كل منتج بطلب منفصل
                for (let i = 0; i < addedProducts.length; i++) {
                    const item = addedProducts[i];
                    
                    // بناء URL مع البيانات
                    const url = `${GOOGLE_SCRIPT_URL}?action=addStockIn&count=1` +
                        `&data[0][date]=${encodeURIComponent(item.date)}` +
                        `&data[0][projectName]=${encodeURIComponent(item.projectName)}` +
                        `&data[0][product]=${encodeURIComponent(item.product)}` +
                        `&data[0][quantity]=${encodeURIComponent(item.quantity)}` +
                        `&data[0][unit]=${encodeURIComponent(item.unit)}` +
                        `&data[0][timestamp]=${encodeURIComponent(item.timestamp)}` +
                        `&data[0][employeeName]=${encodeURIComponent(item.employeeName || 'غير محدد')}`;
                    
                    console.log(`\n📦 إرسال منتج ${i + 1}/${addedProducts.length}:`, item.product);
                    console.log('👤 اسم الموظف:', item.employeeName);
                    
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000);
                        
                        const response = await fetch(url, {
                            method: 'GET',
                            mode: 'cors',
                            signal: controller.signal
                        });
                        
                        clearTimeout(timeoutId);
                        
                        if (!response.ok) {
                            throw new Error(`خطأ ${response.status}`);
                        }
                        
                        const responseText = await response.text();
                        console.log(`📄 نص الرد الخام للمنتج ${i + 1}:`, responseText);
                        
                        const result = JSON.parse(responseText);
                        
                        console.log(`📥 ========== رد الخادم للمنتج ${i + 1} ==========`);
                        console.log('🔹 success:', result.success);
                        console.log('🔹 message:', result.message);
                        console.log('🔹 rowsAdded:', result.rowsAdded);
                        console.log('🔹 sheetName:', result.sheetName);
                        console.log('🔹 totalItems:', result.totalItems);
                        
                        if (result.debugInfo) {
                            console.log('🐛 ========== DEBUG INFO ==========');
                            console.log('عدد العناصر في debugInfo:', result.debugInfo.length);
                            result.debugInfo.forEach((debug, idx) => {
                                console.log(`\n🔸 عنصر ${idx}:`);
                                console.log('  - index:', debug.index);
                                console.log('  - employeeName:', debug.employeeName);
                                console.log('  - جميع المفاتيح:', Object.keys(debug));
                                console.log('  - جميع القيم:', debug);
                            });
                            console.log('==================================');
                        } else {
                            console.warn('⚠️ لا يوجد debugInfo في الرد!');
                        }
                        
                        console.log('🔹 الرد الكامل (JSON):', JSON.stringify(result, null, 2));
                        console.log('===============================================\n');
                        
                        if (result.success) {
                            successCount++;
                            console.log(`✅ نجح منتج ${i + 1}`);
                        } else {
                            failedCount++;
                            console.error(`❌ فشل منتج ${i + 1}:`, result.error);
                        }
                        
                    } catch (error) {
                        failedCount++;
                        console.error(`❌ خطأ في منتج ${i + 1}:`, error.message);
                    }
                }
                
                console.log('\n========== النتيجة النهائية ==========');
                console.log('✅ نجح:', successCount);
                console.log('❌ فشل:', failedCount);
                console.log('======================================');
                
                if (successCount > 0) {
                    showMessage('success', `✅ تم إرسال ${successCount} منتج بنجاح!` + 
                        (failedCount > 0 ? ` (${failedCount} فشل)` : ''));
                    
                    // مسح القائمة بعد الإرسال الناجح
                    addedProducts = [];
                    updateProductsList();
                    
                    // إعادة تعيين النموذج
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                    
                } else {
                    throw new Error('فشل في إرسال جميع المنتجات');
                }
                
            } catch (error) {
                console.error('خطأ في إرسال البيانات:', error);
                
                let errorMessage = 'خطأ غير معروف';
                
                if (error.name === 'AbortError') {
                    errorMessage = 'انتهت مهلة الاتصال (Timeout)';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'فشل في الاتصال. تحقق من الإنترنت والرابط';
                } else if (error.message.includes('CORS')) {
                    errorMessage = 'مشكلة في إعدادات الخادم (CORS)';
                } else {
                    errorMessage = error.message;
                }
                
                showMessage('error', `❌ خطأ في الإرسال: ${errorMessage}`);
                
                // إرشادات إضافية للمستخدم
                setTimeout(() => {
                    showMessage('info', '💡 تأكد من صحة رابط Google Apps Script في الإعدادات');
                }, 3000);
            } finally {
                hideLoadingBar(); // إخفاء شريط التحميل بعد الانتهاء
            }
        }

        // دالة مسح النموذج
        function clearForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('product').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('barcodeInput').value = '';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            
            // مسح قائمة المنتجات المضافة أيضاً
            addedProducts = [];
            updateProductsList();
        }

        // إضافة دعم Enter للبحث بالباركود
        document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchByBarcode();
            }
        });

        // إضافة دعم Enter في حقل الكمية لإضافة المنتج
        document.getElementById('quantity').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addProduct();
            }
        });

        // وظائف ماسح الباركود
        let barcodeDetectionCount = {};
        let minDetections = 3; // عدد القراءات المطلوبة للتأكد
        
        function startBarcodeScanner() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showMessage('error', '❌ الكاميرا غير متوفرة في هذا المتصفح');
                return;
            }

            const scannerElement = document.getElementById('barcodeScanner');
            scannerElement.style.display = 'flex';
            scannerActive = true;
            barcodeDetectionCount = {}; // إعادة تعيين العداد

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scannerVideo'),
                    constraints: {
                        width: 1280,
                        height: 720,
                        facingMode: "environment" // الكاميرا الخلفية
                    }
                },
                frequency: 10, // عدد المحاولات في الثانية
                locator: {
                    patchSize: "large", // حجم أكبر للدقة
                    halfSample: false // دقة كاملة بدون تقليل
                },
                numOfWorkers: 4, // عدد أكبر من العمال
                decoder: {
                    readers: [
                        "ean_reader", // الأولوية لـ EAN
                        "ean_8_reader",
                        "code_128_reader",
                        "code_39_reader",
                        "upc_reader",
                        "upc_e_reader"
                    ],
                    multiple: false // قراءة باركود واحد فقط
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error('خطأ في تشغيل الكاميرا:', err);
                    showMessage('error', '❌ لم يتم العثور على كاميرا أو رفض الوصول');
                    stopBarcodeScanner();
                    return;
                }
                Quagga.start();
                showMessage('success', '📷 تم تشغيل الكاميرا بنجاح');
            });

            // معالج قراءة الباركود مع التحقق من الجودة
            Quagga.onDetected(function(data) {
                const barcode = data.codeResult.code;
                const quality = data.codeResult.quality || 0;
                
                console.log('📱 تم اكتشاف باركود:', barcode, 'جودة:', quality);
                
                // التحقق من جودة القراءة (يجب أن تكون أعلى من 75)
                if (quality < 75) {
                    console.warn('⚠️ جودة القراءة منخفضة:', quality);
                    return;
                }
                
                // عد مرات اكتشاف نفس الباركود
                if (!barcodeDetectionCount[barcode]) {
                    barcodeDetectionCount[barcode] = 0;
                }
                barcodeDetectionCount[barcode]++;
                
                // إذا تم قراءة الباركود عدة مرات متتالية، نقبله
                if (barcodeDetectionCount[barcode] >= minDetections) {
                    document.getElementById('barcodeInput').value = barcode;
                    stopBarcodeScanner();
                    
                    // البحث التلقائي بعد المسح
                    setTimeout(() => {
                        searchByBarcode();
                    }, 500);
                    
                    showMessage('success', `📱 تم مسح الباركود: ${barcode}`);
                } else {
                    // إظهار مؤشر التقدم
                    console.log(`📊 تقدم القراءة: ${barcodeDetectionCount[barcode]}/${minDetections}`);
                }
            });
        }

        function stopBarcodeScanner() {
            if (scannerActive) {
                Quagga.stop();
                scannerActive = false;
            }
            document.getElementById('barcodeScanner').style.display = 'none';
        }

        function toggleFlash() {
            if (!scannerActive) return;
            
            const track = Quagga.CameraAccess.getActiveTrack();
            if (track && 'torch' in track.getCapabilities()) {
                flashEnabled = !flashEnabled;
                track.applyConstraints({
                    advanced: [{ torch: flashEnabled }]
                }).then(() => {
                    showMessage('success', flashEnabled ? '💡 تم تشغيل الفلاش' : '💡 تم إطفاء الفلاش');
                }).catch(() => {
                    showMessage('error', '❌ الفلاش غير متوفر');
                });
            } else {
                showMessage('error', '❌ الفلاش غير مدعوم في هذا الجهاز');
            }
        }

        // دالة اختبار الاتصال مع Google Apps Script
        async function testConnection() {
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    showMessage('error', '❌ لم يتم تعيين رابط Google Apps Script');
                    return false;
                }
                
                showMessage('info', '🔄 جاري اختبار الاتصال...');
                
                const response = await fetch(GOOGLE_SCRIPT_URL + '?type=projects', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showMessage('success', '✅ الاتصال يعمل بشكل صحيح');
                        return true;
                    } else {
                        showMessage('error', '❌ خطأ في البيانات: ' + (result.error || 'غير محدد'));
                        return false;
                    }
                } else {
                    showMessage('error', `❌ خطأ في الاتصال: ${response.status}`);
                    return false;
                }
                
            } catch (error) {
                showMessage('error', '❌ فشل في الاتصال: ' + error.message);
                return false;
            }
        }

        // إضافة دالة لاختبار الاتصال عند الحاجة
        window.testConnection = testConnection;

        // بحث حي في قائمة المنتجات
        const productSearchInput = document.getElementById('productSearchInput');
        if (productSearchInput) {
            productSearchInput.addEventListener('input', function() {
                const searchText = this.value.trim().toLowerCase();
                const productSelect = document.getElementById('product');
                
                if (!searchText) {
                    // إذا كان الحقل فارغ، أظهر كل المنتجات
                    productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                    productsData.forEach(product => {
                        const option = document.createElement('option');
                        option.value = product.name;
                        option.textContent = product.name;
                        option.dataset.barcode = product.barcode || '';
                        option.dataset.unit = product.unit || 'قطعة';
                        productSelect.appendChild(option);
                    });
                    return;
                }
                
                // تصفية المنتجات بناءً على النص المدخل
                const filteredProducts = productsData.filter(product => 
                    product.name.toLowerCase().includes(searchText)
                );
                
                // تحديث القائمة
                productSelect.innerHTML = '<option value="">اختر من النتائج (' + filteredProducts.length + ')</option>';
                filteredProducts.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.name;
                    option.textContent = product.name;
                    option.dataset.barcode = product.barcode || '';
                    option.dataset.unit = product.unit || 'قطعة';
                    productSelect.appendChild(option);
                });
                
                // إذا كانت هناك نتيجة واحدة، حددها تلقائياً
                if (filteredProducts.length === 1) {
                    productSelect.value = filteredProducts[0].name;
                    productSelect.dispatchEvent(new Event('change'));
                }
            });
        }

        // تحديث القائمة المنسدلة عند تغيير قيمة barcodeInput لحقل المنتج
        const barcodeInput = document.getElementById('barcodeInput');
        barcodeInput.addEventListener('input', function() {
            const input = barcodeInput.value.trim().toLowerCase();
            const productSelect = document.getElementById('product');
            if (!input) {
                // إذا كان الحقل فارغ، أظهر كل المنتجات
                productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                productsData.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.name;
                    option.textContent = product.name;
                    option.dataset.barcode = product.barcode || '';
                    option.dataset.unit = product.unit || 'قطعة';
                    productSelect.appendChild(option);
                });
                return;
            }
            // تصفية المنتجات بناءً على الباركود أو الاسم
            const filteredProducts = productsData.filter(product => 
                product.name.toLowerCase().includes(input) || 
                (product.barcode && product.barcode.includes(input))
            );
            productSelect.innerHTML = '<option value="">اختر المنتج</option>';
            filteredProducts.forEach(product => {
                const option = document.createElement('option');
                option.value = product.name;
                option.textContent = product.name;
                option.dataset.barcode = product.barcode || '';
                option.dataset.unit = product.unit || 'قطعة';
                productSelect.appendChild(option);
            });
        });

        // عرض اسم الموظف
        function displayEmployeeName() {
            const employeeName = sessionStorage.getItem('employeeName');
            const welcomeElement = document.getElementById('employeeWelcome');
            
            if (employeeName && welcomeElement) {
                welcomeElement.textContent = `مرحباً ${employeeName}`;
            }
        }

        // استدعاء عرض اسم الموظف عند تحميل الصفحة
        window.addEventListener('load', displayEmployeeName);

        // إغلاق الماسح عند الضغط على Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && scannerActive) {
                stopBarcodeScanner();
            }
        });
    </script>
