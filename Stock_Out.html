<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a7f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Cafe Stock - إدارة المخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/logo.png" alt="شعار الكافيه" class="logo">
            <h1>تصدير مخزون الكافيه</h1>
        </div>
        
        <form id="stockForm">
            <div class="form-group">
                <label for="date">التاريخ:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="projectName">اسم المشروع:</label>
                <select id="projectName" name="projectName" required>
                    <option value="">جاري التحميل...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="product">المنتج:</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="barcode-input-container">
                        <input type="text" id="barcodeInput" placeholder="امسح أو أدخل الباركود">
                        <button type="button" onclick="startBarcodeScanner()" class="camera-btn">📷</button>
                    </div>
                    <button type="button" onclick="searchByBarcodeOrName()" style="flex: 0.5; background: linear-gradient(135deg, #024069, #2980b9); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 80px; padding: 12px 8px;">🔍 بحث</button>
                </div>
                <select id="product" name="product" required>
                    <option value="">جاري التحميل...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">الكمية والوحدة:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="quantity" name="quantity" placeholder="أدخل الكمية" min="1" required style="flex: 2;">
                    <input type="text" id="unit" name="unit" placeholder="الوحدة" readonly style="flex: 1; background-color: #f8f9fa; color: #6c757d;">
                </div>
            </div>

     <div class="button-group">
                <button type="button" class="btn-add" onclick="addProduct()">➕ إضافة منتج</button>
                <button type="button" class="btn-clear" onclick="clearForm()">🗑️ مسح</button>
                <button type="button" class="btn-back" onclick="window.location.href='index.html'">🏠 الرجوع</button>
            </div>
            
            <!-- قائمة المنتجات المضافة -->
            <div id="addedProductsList" class="added-products-list" style="display: none;">
                <h3>المنتجات المadded:</h3>
                <div id="productsContainer"></div>
                <div class="send-button-container">
                    <button type="button" class="btn-send" onclick="sendToGoogleSheets()">📤 إرسال جميع البيانات</button>
                    <button type="button" class="btn-clear-all" onclick="clearAllProducts()">🗑️ مسح الكل</button>
                </div>
            </div>

            <div id="successMessage" class="success-message">
                تم حفظ البيانات بنجاح!
            </div>
        </form>
    </div>

    <!-- واجهة ماسح الباركود -->
    <div id="barcodeScanner" class="barcode-scanner">
        <div class="scanner-container">
            <div class="scanner-header">
                <h3>📷 ماسح الباركود</h3>
                <p>وجه الكاميرا نحو الباركود</p>
            </div>
            
            <div class="scanner-video" id="scannerVideo">
                <div class="scan-overlay"></div>
                <div class="scan-corners"></div>
                <div class="scan-line"></div>
            </div>
            
            <div class="scanner-controls">
                <button class="scanner-btn btn-close-scanner" onclick="stopBarcodeScanner()">
                    ❌ إغلاق
                </button>
                <button class="scanner-btn btn-toggle-flash" onclick="toggleFlash()">
                    💡 فلاش
                </button>
            </div>
            
            <div style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
                <p>💡 تأكد من وضوح الباركود في المنطقة المحددة</p>
            </div>
        </div>
    </div>

    <!-- شريط التحميل الاحترافي -->
    <div id="loadingBar" class="loading-bar-overlay" style="display:none;">
        <div class="loading-bar-container">
            <div class="loading-bar-spinner" style="width:60px;height:60px;border:6px solid #20B2AA;border-top:6px solid #fff;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
            <div class="loading-bar-text" style="margin-top:20px;font-size:20px;color:#20B2AA;font-weight:bold;">جاري إرسال البيانات...</div>
        </div>
        <style>
        @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
        </style>
    </div>

    <!-- نافذة الخطأ المنبثقة -->
    <div id="errorModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>⚠️ خطأ في الربط مع Google Sheets</h2>
            <p>لم يتم تعيين رابط Google Apps Script.<br>يرجى الذهاب إلى صفحة الإعدادات أولاً.</p>
            <button onclick="window.location.href='index.html'" class="btn-back-modal">الرجوع للصفحة الرئيسية</button>
        </div>
    </div>
    <script>
        // جلب رابط Google Apps Script من config.json وتخزينه في localStorage إذا لم يكن موجوداً
        window.addEventListener('DOMContentLoaded', async function() {
            if (!localStorage.getItem('googleAppsScriptUrl')) {
                try {
                    const res = await fetch('config.json');
                    const config = await res.json();
                    if (config.googleAppsScriptUrl) {
                        localStorage.setItem('googleAppsScriptUrl', config.googleAppsScriptUrl);
                    }
                } catch (e) {
                    console.error('فشل في جلب إعدادات Google Apps Script من config.json:', e);
                }
            }
        });
        // جلب رابط Google Apps Script من config.json وتخزينه في localStorage إذا لم يكن موجوداً
        window.addEventListener('DOMContentLoaded', async function() {
            if (!localStorage.getItem('googleAppsScriptUrl')) {
                try {
                    const res = await fetch('/config.json');
                    const config = await res.json();
                    if (config.googleAppsScriptUrl) {
                        localStorage.setItem('googleAppsScriptUrl', config.googleAppsScriptUrl);
                    }
                } catch (e) {
                    console.error('فشل في جلب إعدادات Google Apps Script من config.json:', e);
                }
            }
        });
        // تعيين التاريخ الحالي تلقائياً
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // متغيرات عامة
        let productsData = [];
        let scannerActive = false;
        let flashEnabled = false;
        let addedProducts = []; // قائمة المنتجات المضافة

        // تحميل المشاريع من Google Sheets
        // دوال إظهار/إخفاء شريط التحميل
        function showLoadingBar() {
            document.getElementById('loadingBar').style.display = 'flex';
        }
        function hideLoadingBar() {
            document.getElementById('loadingBar').style.display = 'none';
        }

        // دوال إظهار نافذة الخطأ المنبثقة
        function showErrorModal() {
            document.getElementById('errorModal').style.display = 'flex';
        }
        function hideErrorModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        async function loadProjects() {
            const projectSelect = document.getElementById('projectName');
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                if (!GOOGLE_SCRIPT_URL) {
                    showErrorModal();
                    return;
                }
                showLoadingBar();
                projectSelect.innerHTML = '<option value="">جاري التحميل...</option>';
                const response = await fetch(GOOGLE_SCRIPT_URL + '?type=projects');
                const result = await response.json();
                if (result.success && result.data) {
                    projectSelect.innerHTML = '<option value="">اختر المشروع</option>';
                    result.data.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project;
                        option.textContent = project;
                        projectSelect.appendChild(option);
                    });
                } else {
                    throw new Error(result.error || 'فشل في تحميل بيانات المشاريع');
                }
            } catch (error) {
                console.error('خطأ في تحميل المشاريع:', error);
                handleLoadError(projectSelect, error, 'المشاريع');
            } finally {
                hideLoadingBar();
            }
        }

        // تحميل المنتجات من Google Sheets
        async function loadProducts() {
            const productSelect = document.getElementById('product');
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                if (!GOOGLE_SCRIPT_URL) {
                    showErrorModal();
                    return;
                }
                showLoadingBar();
                productSelect.innerHTML = '<option value="">جاري تحميل المنتجات...</option>';
                const response = await fetch(GOOGLE_SCRIPT_URL + '?type=products');
                const result = await response.json();
                if (result.success && result.data) {
                    productsData = result.data;
                    productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                    result.data.forEach(product => {
                        const option = document.createElement('option');
                        option.value = product.name;
                        option.textContent = product.name;
                        option.dataset.barcode = product.barcode;
                        option.dataset.unit = product.unit || 'قطعة';
                        productSelect.appendChild(option);
                    });
                    console.log(`تم تحميل ${result.count} منتج بنجاح`);
                } else {
                    throw new Error(result.error || 'فشل في تحميل بيانات المنتجات');
                }
            } catch (error) {
                console.error('خطأ في تحميل المنتجات:', error);
                handleLoadError(productSelect, error, 'المنتجات');
            } finally {
                hideLoadingBar();
            }
        }

        // البحث عن منتج بالباركود
        async function searchByBarcode() {
            const barcodeInput = document.getElementById('barcodeInput');
            const productSelect = document.getElementById('product');
            const barcode = barcodeInput.value.trim();
            
            if (!barcode) {
                alert('يرجى إدخال الباركود أولاً');
                return;
            }

            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('لم يتم تعيين رابط Google Apps Script.');
                }
                
                // البحث في البيانات المحلية أولاً
                const localProduct = productsData.find(p => p.barcode === barcode);
                if (localProduct) {
                    // تحديد المنتج في القائمة
                    productSelect.value = localProduct.name;
                    // تحديث الوحدة
                    document.getElementById('unit').value = localProduct.unit || 'قطعة';
                    showMessage('success', `✅ تم العثور على المنتج: ${localProduct.name}`);
                    return;
                }

                // البحث في الخادم
                const response = await fetch(GOOGLE_SCRIPT_URL + `?type=search&barcode=${encodeURIComponent(barcode)}`);
                const result = await response.json();
                
                if (result.success && result.found) {
                    // تحديد المنتج في القائمة
                    productSelect.value = result.data.name;
                    // تحديث الوحدة
                    document.getElementById('unit').value = result.data.unit || 'قطعة';
                    showMessage('success', `✅ تم العثور على المنتج: ${result.data.name}`);
                    
                    // إضافة المنتج للبيانات المحلية إذا لم يكن موجوداً
                    if (!productsData.find(p => p.barcode === result.data.barcode)) {
                        productsData.push(result.data);
                        
                        // إضافة خيار جديد للقائمة
                        const option = document.createElement('option');
                        option.value = result.data.name;
                        option.textContent = result.data.name;
                        option.dataset.barcode = result.data.barcode;
                        option.dataset.unit = result.data.unit || 'قطعة';
                        productSelect.appendChild(option);
                        productSelect.value = result.data.name;
                    }
                } else {
                    showMessage('error', `❌ ${result.message || 'لم يتم العثور على منتج بهذا الباركود'}`);
                }
                
            } catch (error) {
                console.error('خطأ في البحث:', error);
                showMessage('error', `❌ خطأ في البحث: ${error.message}`);
            } finally {
                // مسح حقل الباركود
                barcodeInput.value = '';
            }
        }

        // البحث عن المنتجات باستخدام الباركود أو اسم المنتج
function searchByBarcodeOrName() {
    const input = document.getElementById('barcodeInput').value.trim().toLowerCase();
    const productSelect = document.getElementById('product');

    if (!input) {
        alert('يرجى إدخال الباركود أو اسم المنتج للبحث');
        return;
    }

    // تصفية المنتجات بناءً على الباركود أو اسم المنتج
    const filteredProducts = productsData.filter(product => 
        product.name.toLowerCase().includes(input) || 
        product.barcode.includes(input)
    );

    // تحديث القائمة المنسدلة
    productSelect.innerHTML = '<option value="">اختر المنتج</option>';
    filteredProducts.forEach(product => {
        const option = document.createElement('option');
        option.value = product.name;
        option.textContent = product.name;
        option.dataset.barcode = product.barcode;
        option.dataset.unit = product.unit || 'قطعة';
        productSelect.appendChild(option);
    });

    if (filteredProducts.length === 0) {
        alert('لم يتم العثور على منتجات مطابقة');
    }
}

// تعديل زر البحث فقط إذا كان موجودًا
window.addEventListener('DOMContentLoaded', function() {
    var searchButton = document.querySelector('button[onclick="searchByKeyword()"]');
    if (searchButton) {
        searchButton.setAttribute('onclick', 'searchByBarcodeOrName()');
    }
});

        // معالجة أخطاء التحميل
        function handleLoadError(selectElement, error, dataType) {
            selectElement.innerHTML = `
                <option value="">خطأ في تحميل ${dataType}</option>
                <option value="عنصر تجريبي">عنصر تجريبي</option>
            `;
            
            // إضافة رسالة خطأ مع رابط للإعدادات
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = `
                <div style="background: #ffebee; border: 2px solid #f44336; border-radius: 8px; padding: 15px; margin-top: 15px; color: #c62828; text-align: center;">
                    <strong>⚠️ خطأ في تحميل ${dataType}:</strong><br>
                    ${error.message}<br>
                    <a href="0541.html" style="color: #1976d2; text-decoration: underline; font-weight: bold;">
                        🔧 اذهب إلى صفحة الإعدادات
                    </a>
                </div>
            `;
            
            selectElement.parentNode.appendChild(errorDiv);
        }

        // إظهار الرسائل
        function showMessage(type, text) {
            // إزالة الرسائل السابقة
            const existingMessages = document.querySelectorAll('.temp-message');
            existingMessages.forEach(msg => msg.remove());
            
            // إنشاء رسالة جديدة
            const messageDiv = document.createElement('div');
            messageDiv.className = 'temp-message';
            
            let bgColor, textColor, borderColor;
            switch(type) {
                case 'success':
                    bgColor = 'linear-gradient(135deg, #E0F8F8, #B8E6E6)';
                    textColor = '#1A7A73';
                    borderColor = '#20B2AA';
                    break;
                case 'error':
                    bgColor = 'linear-gradient(135deg, #ffebee, #ffcdd2)';
                    textColor = '#c62828';
                    borderColor = '#f44336';
                    break;
                case 'info':
                    bgColor = 'linear-gradient(135deg, #e3f2fd, #bbdefb)';
                    textColor = '#1565c0';
                    borderColor = '#2196f3';
                    break;
                default:
                    bgColor = 'linear-gradient(135deg, #E0F8F8, #B8E6E6)';
                    textColor = '#1A7A73';
                    borderColor = '#20B2AA';
            }
            
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                font-weight: bold;
                z-index: 1000;
                max-width: 400px;
                font-family: 'Cairo', sans-serif;
                background: ${bgColor};
                color: ${textColor};
                border: 2px solid ${borderColor};
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                animation: slideIn 0.3s ease-out;
            `;
            messageDiv.textContent = text;
            
            document.body.appendChild(messageDiv);
            
            // إخفاء الرسالة بعد 4 ثواني
            setTimeout(() => {
                messageDiv.remove();
            }, 4000);
        }

        // تحديث القائمة المنسدلة عند تغيير قيمة barcodeInput
const barcodeInput = document.getElementById('barcodeInput');
barcodeInput.addEventListener('input', function() {
    const input = barcodeInput.value.trim().toLowerCase();
    const productSelect = document.getElementById('product');
    if (!input) {
        // إذا كان الحقل فارغ، أظهر كل المنتجات
        productSelect.innerHTML = '<option value="">اختر المنتج</option>';
        productsData.forEach(product => {
            const option = document.createElement('option');
            option.value = product.name;
            option.textContent = product.name;
            option.dataset.barcode = product.barcode;
            option.dataset.unit = product.unit || 'قطعة';
            productSelect.appendChild(option);
        });
        return;
    }
    // تصفية المنتجات بناءً على الباركود أو الاسم
    const filteredProducts = productsData.filter(product => 
        product.name.toLowerCase().includes(input) || 
        product.barcode.includes(input)
    );
    productSelect.innerHTML = '<option value="">اختر المنتج</option>';
    filteredProducts.forEach(product => {
        const option = document.createElement('option');
        option.value = product.name;
        option.textContent = product.name;
        option.dataset.barcode = product.barcode;

});

        // تحميل البيانات عند تحميل الصفحة
        window.addEventListener('load', function() {
            loadProjects();
            loadProducts();
        });

        // تحديث الوحدة عند اختيار منتج من القائمة
        document.getElementById('product').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const unit = selectedOption.dataset.unit || 'قطعة';
            document.getElementById('unit').value = unit;
        });

        // معالج إرسال النموذج - تم إلغاؤه لصالح نظام الإضافة
        // document.getElementById('stockForm').addEventListener('submit', function(e) {
        //     e.preventDefault();
        //     addProduct(); // استبدال بدالة إضافة المنتج
        // });

        // دالة إضافة منتج جديد
        function addProduct() {
            // الحصول على البيانات
            const date = document.getElementById('date').value;
            const projectName = document.getElementById('projectName').value;
            const product = document.getElementById('product').value;
            const quantity = document.getElementById('quantity').value;
            const unit = document.getElementById('unit').value;
            
            // التحقق من البيانات
            if (!date) {
                alert('يرجى تحديد التاريخ');
                return;
            }
            
            if (!projectName) {
                alert('يرجى اختيار اسم المشروع');
                return;
            }
            
            if (!product) {
                alert('يرجى اختيار المنتج');
                return;
            }
            
            if (!quantity || quantity <= 0) {
                alert('يرجى إدخال كمية صحيحة');
                return;
            }
            
            // إنشاء كائن المنتج
            const productItem = {
                id: Date.now(), // معرف فريد
                date: date,
                projectName: projectName,
                product: product,
                quantity: quantity,
                unit: unit || 'قطعة',
                timestamp: new Date().toISOString()
            };
            
            // إضافة المنتج للقائمة
            addedProducts.push(productItem);
            
            // تحديث العرض
            updateProductsList();
            
            // مسح بيانات المنتج والكمية فقط
            clearProductFields();
            
            // إظهار رسالة نجاح
            showMessage('success', '✅ تم إضافة المنتج بنجاح!');
        }

        // دالة تحديث قائمة المنتجات المعروضة
        function updateProductsList() {
            const listContainer = document.getElementById('addedProductsList');
            const productsContainer = document.getElementById('productsContainer');
            
            if (addedProducts.length === 0) {
                listContainer.style.display = 'none';
                return;
            }
            
            listContainer.style.display = 'block';
            productsContainer.innerHTML = '';
            
            addedProducts.forEach((item, index) => {
                const productDiv = document.createElement('div');
                productDiv.className = 'product-item';
                productDiv.innerHTML = `
                    <div class="product-info">
                        <div class="product-name">${item.product}</div>
                        <div class="product-details">الكمية: ${item.quantity} ${item.unit}</div>
                    </div>
                    <button class="remove-btn" onclick="removeProduct(${item.id})" title="حذف المنتج">❌</button>
                `;
                productsContainer.appendChild(productDiv);
            });
        }

        // دالة حذف منتج من القائمة
        function removeProduct(productId) {
            addedProducts = addedProducts.filter(item => item.id !== productId);
            updateProductsList();
            showMessage('success', '🗑️ تم حذف المنتج');
        }

        // دالة مسح جميع المنتجات
        function clearAllProducts() {
            if (addedProducts.length === 0) {
                alert('لا توجد منتجات للحذف');
                return;
            }
            
            if (confirm('هل أنت متأكد من حذف جميع المنتجات؟')) {
                addedProducts = [];
                updateProductsList();
                showMessage('success', '🗑️ تم حذف جميع المنتجات');
            }
        }

        // دالة مسح حقول المنتج والكمية فقط
        function clearProductFields() {
            document.getElementById('product').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('barcodeInput').value = '';
            // إذا كان حقل البحث فارغ، أظهر كل المنتجات في القائمة المنسدلة
            const barcodeInput = document.getElementById('barcodeInput');
            const productSelect = document.getElementById('product');
            if (!barcodeInput.value.trim()) {
                productSelect.innerHTML = '<option value="">اختر المنتج</option>';
                productsData.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.name;
                    option.textContent = product.name;
                    option.dataset.barcode = product.barcode || '';
                    option.dataset.unit = product.unit || 'قطعة';
                    productSelect.appendChild(option);
                });
            }
        }

        // دالة إرسال البيانات إلى Google Sheets
        async function sendToGoogleSheets() {
            if (addedProducts.length === 0) {
                alert('يرجى إضافة منتجات أولاً');
                return;
            }
            showLoadingBar(); // إظهار شريط التحميل
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('لم يتم تعيين رابط Google Apps Script. يرجى الذهاب إلى صفحة الإعدادات أولاً.');
                }
                
                // التحقق من صحة الرابط
                if (!GOOGLE_SCRIPT_URL.includes('script.google.com')) {
                    throw new Error('رابط Google Apps Script غير صحيح. يجب أن يحتوي على script.google.com');
                }
                
                // إظهار رسالة التحميل
                showMessage('info', '📤 جاري إرسال البيانات...');
                
                // تحويل البيانات إلى معاملات URL للإرسال عبر GET
                const dataParams = addedProducts.map((item, index) => {
                    return `data[${index}][date]=${encodeURIComponent(item.date)}&` +
                           `data[${index}][projectName]=${encodeURIComponent(item.projectName)}&` +
                           `data[${index}][product]=${encodeURIComponent(item.product)}&` +
                           `data[${index}][quantity]=${encodeURIComponent(item.quantity)}&` +
                           `data[${index}][unit]=${encodeURIComponent(item.unit)}&` +
                           `data[${index}][timestamp]=${encodeURIComponent(item.timestamp)}`;
                }).join('&');
                
                // إرسال البيانات عبر GET بدلاً من POST
                const url = `${GOOGLE_SCRIPT_URL}?action=addStockOut&count=${addedProducts.length}&${dataParams}`;
                
                console.log('إرسال البيانات إلى:', url);
                console.log('عدد المنتجات:', addedProducts.length);
                
                // إعداد timeout للطلب
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 ثانية
                
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    signal: controller.signal,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`خطأ في الخادم: ${response.status} - ${response.statusText}`);
                }
                
                const responseText = await response.text();
                console.log('رد الخادم:', responseText);
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error('رد الخادم ليس بصيغة JSON صحيحة');
                }
                
                if (result.success) {
                    showMessage('success', `✅ تم إرسال ${addedProducts.length} منتج بنجاح!`);
                    
                    // مسح القائمة بعد الإرسال الناجح
                    addedProducts = [];
                    updateProductsList();
                    
                    // إعادة تعيين النموذج
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                    
                } else {
                    throw new Error(result.error || 'فشل في إرسال البيانات');
                }
                
            } catch (error) {
                console.error('خطأ في إرسال البيانات:', error);
                
                let errorMessage = 'خطأ غير معروف';
                
                if (error.name === 'AbortError') {
                    errorMessage = 'انتهت مهلة الاتصال (Timeout)';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'فشل في الاتصال. تحقق من الإنترنت والرابط';
                } else if (error.message.includes('CORS')) {
                    errorMessage = 'مشكلة في إعدادات الخادم (CORS)';
                } else {
                    errorMessage = error.message;
                }
                
                showMessage('error', `❌ خطأ في الإرسال: ${errorMessage}`);
                
                // إرشادات إضافية للمستخدم
                setTimeout(() => {
                    showMessage('info', '💡 تأكد من صحة رابط Google Apps Script في الإعدادات');
                }, 3000);
            } finally {
                hideLoadingBar(); // إخفاء شريط التحميل بعد الانتهاء
            }
        }

        // دالة مسح النموذج
        function clearForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('product').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('barcodeInput').value = '';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            
            // مسح قائمة المنتجات المضافة أيضاً
            addedProducts = [];
            updateProductsList();
        }

        // إضافة دعم Enter للبحث بالباركود
        document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchByBarcode();
            }
        });

        // إضافة دعم Enter في حقل الكمية لإضافة المنتج
        document.getElementById('quantity').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addProduct();
            }
        });

        // وظائف ماسح الباركود
        function startBarcodeScanner() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showMessage('error', '❌ الكاميرا غير متوفرة في هذا المتصفح');
                return;
            }

            const scannerElement = document.getElementById('barcodeScanner');
            scannerElement.style.display = 'flex';
            scannerActive = true;

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scannerVideo'),
                    constraints: {
                        width: 500,
                        height: 300,
                        facingMode: "environment" // الكاميرا الخلفية
                    }
                },
                locator: {
                    patchSize: "medium",
                    halfSample: true
                },
                numOfWorkers: 2,
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "code_39_vin_reader",
                        "codabar_reader",
                        "upc_reader",
                        "upc_e_reader",
                        "i2of5_reader"
                    ]
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error('خطأ في تشغيل الكاميرا:', err);
                    showMessage('error', '❌ لم يتم العثور على كاميرا أو رفض الوصول');
                    stopBarcodeScanner();
                    return;
                }
                Quagga.start();
                showMessage('success', '📷 تم تشغيل الكاميرا بنجاح');
            });

            // معالج قراءة الباركود
            Quagga.onDetected(function(data) {
                const barcode = data.codeResult.code;
                document.getElementById('barcodeInput').value = barcode;
                stopBarcodeScanner();
                
                // البحث التلقائي بعد المسح
                setTimeout(() => {
                    searchByBarcode();
                }, 500);
                
                showMessage('success', `📱 تم مسح الباركود: ${barcode}`);
            });
        }

        function stopBarcodeScanner() {
            if (scannerActive) {
                Quagga.stop();
                scannerActive = false;
            }
            document.getElementById('barcodeScanner').style.display = 'none';
        }

        function toggleFlash() {
            if (!scannerActive) return;
            
            const track = Quagga.CameraAccess.getActiveTrack();
            if (track && 'torch' in track.getCapabilities()) {
                flashEnabled = !flashEnabled;
                track.applyConstraints({
                    advanced: [{ torch: flashEnabled }]
                }).then(() => {
                    showMessage('success', flashEnabled ? '💡 تم تشغيل الفلاش' : '💡 تم إطفاء الفلاش');
                }).catch(() => {
                    showMessage('error', '❌ الفلاش غير متوفر');
                });
            } else {
                showMessage('error', '❌ الفلاش غير مدعوم في هذا الجهاز');
            }
        }

        // دالة اختبار الاتصال مع Google Apps Script
        async function testConnection() {
            try {
                const GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    showMessage('error', '❌ لم يتم تعيين رابط Google Apps Script');
                    return false;
                }
                
                showMessage('info', '🔄 جاري اختبار الاتصال...');
                
                const response = await fetch(GOOGLE_SCRIPT_URL + '?type=projects', {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showMessage('success', '✅ الاتصال يعمل بشكل صحيح');
                        return true;
                    } else {
                        showMessage('error', '❌ خطأ في البيانات: ' + (result.error || 'غير محدد'));
                        return false;
                    }
                } else {
                    showMessage('error', `❌ خطأ في الاتصال: ${response.status}`);
                    return false;
                }
                
            } catch (error) {
                showMessage('error', '❌ فشل في الاتصال: ' + error.message);
                return false;
            }
        }

        // إضافة دالة لاختبار الاتصال عند الحاجة
        window.testConnection = testConnection;

        // إغلاق الماسح عند الضغط على Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && scannerActive) {
                stopBarcodeScanner();
            }
        });

        // البحث عن المنتجات باستخدام كلمة مفتاحية
        function searchByKeyword() {
            const keyword = document.getElementById('barcodeInput').value.trim().toLowerCase();
            const productSelect = document.getElementById('product');

            if (!keyword) {
                alert('يرجى إدخال كلمة مفتاحية أو باركود للبحث');
                return;
            }

            // تصفية المنتجات بناءً على الكلمة المفتاحية
            const filteredProducts = productsData.filter(product => 
                product.name.toLowerCase().includes(keyword) || 
                product.barcode.includes(keyword)
            );

            // تحديث القائمة المنسدلة
            productSelect.innerHTML = '<option value="">اختر المنتج</option>';
            filteredProducts.forEach(product => {
                const option = document.createElement('option');
                option.value = product.name;
                option.textContent = product.name;
                option.dataset.barcode = product.barcode;
                option.dataset.unit = product.unit || 'قطعة';
                productSelect.appendChild(option);
            });

            if (filteredProducts.length === 0) {
                alert('لم يتم العثور على منتجات مطابقة');
            }
        }

        // إضافة دعم البحث عند الضغط على زر البحث
        // تم تعديل زر البحث مسبقاً، لا داعي لإعادة تعريف المتغير searchButton هنا
                var btn = document.querySelector('button[onclick="searchByBarcode()"]');
                if (btn) {
                    btn.setAttribute('onclick', 'searchByKeyword()');
                }
    </script>
</body>
