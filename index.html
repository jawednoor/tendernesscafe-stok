<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a7f8b">
    <title>تسجيل الدخول - Cafe Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a7f8b 0%, #20B2AA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        h1 {
            color: #1a7f8b;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            color: #1a7f8b;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 18px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #20B2AA;
            border-radius: 10px;
            font-size: 18px;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            transition: all 0.3s;
            direction: ltr;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #1a7f8b;
            box-shadow: 0 0 15px rgba(32, 178, 170, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #20B2AA, #1a7f8b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(32, 178, 170, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 15px;
            border: 1px solid #ef5350;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #1a7f8b;
            font-size: 16px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #20B2AA;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            input[type="text"] {
                font-size: 16px;
            }

            .btn-login {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="img/logo.png" alt="شعار الكافيه" class="logo">
        <h1>نظام إدارة المخزون</h1>
        <p class="subtitle">أدخل كود الموظف للدخول</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="employeeCode">كود الموظف</label>
                <input 
                    type="text" 
                    id="employeeCode" 
                    name="employeeCode" 
                    placeholder="أدخل الكود هنا" 
                    required 
                    autofocus
                >
            </div>

            <button type="submit" class="btn-login">
                🔓 دخول
            </button>

            <div class="loading">
                <span class="spinner"></span>
                جاري التحقق...
            </div>

            <div class="error-message" id="errorMessage">
                ❌ الكود غير صحيح أو غير مسموح
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const employeeCodeInput = document.getElementById('employeeCode');
        const errorMessage = document.getElementById('errorMessage');
        const loadingElement = document.querySelector('.loading');
        let employeeCodes = [];
        let isCodesLoaded = false;
        let GOOGLE_SCRIPT_URL = '';

        // جلب أكواد الموظفين عند تحميل الصفحة
        async function loadEmployeeCodes() {
            // إظهار التحميل
            loadingElement.classList.add('show');
            loadingElement.querySelector('.loading').textContent = 'جاري الاتصال بالنظام...';
            
            try {
                // الحصول على رابط Google Apps Script من localStorage أو config.json
                GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    console.log('🔍 جاري جلب الإعدادات من config.json...');
                    const configRes = await fetch('config.json');
                    
                    if (!configRes.ok) {
                        throw new Error('فشل في تحميل ملف الإعدادات');
                    }
                    
                    const config = await configRes.json();
                    GOOGLE_SCRIPT_URL = config.googleAppsScriptUrl;
                    
                    if (!GOOGLE_SCRIPT_URL) {
                        throw new Error('رابط Google Apps Script غير موجود في الإعدادات');
                    }
                    
                    localStorage.setItem('googleAppsScriptUrl', GOOGLE_SCRIPT_URL);
                    console.log('✅ تم حفظ رابط Google Apps Script');
                }
                
                console.log('🔗 الاتصال بـ Google Apps Script...');
                const url = GOOGLE_SCRIPT_URL + '?type=users';
                
                // إضافة timeout للاتصال
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                const res = await fetch(url, {
                    method: 'GET',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                console.log('📡 حالة الاستجابة:', res.status, res.statusText);
                
                if (!res.ok) {
                    throw new Error(`خطأ في الاتصال: ${res.status}`);
                }
                
                const data = await res.json();
                console.log('📥 البيانات المستلمة:', data);
                
                if (data.success && Array.isArray(data.data) && data.data.length > 0) {
                    employeeCodes = data.data.map(code => code.toString().trim());
                    isCodesLoaded = true;
                    console.log('✅ تم تحميل أكواد الموظفين بنجاح:', employeeCodes);
                    console.log('📊 عدد الأكواد:', employeeCodes.length);
                } else {
                    throw new Error('لم يتم العثور على أكواد موظفين في Google Sheets');
                }
                
            } catch (error) {
                console.error('❌ خطأ في تحميل أكواد الموظفين:', error);
                isCodesLoaded = false;
                
                // عرض رسالة خطأ للمستخدم
                errorMessage.textContent = '⚠️ فشل الاتصال بالنظام. يرجى المحاولة لاحقاً';
                errorMessage.classList.add('show');
                
                // إخفاء الرسالة بعد 5 ثوان
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 5000);
            } finally {
                // إخفاء التحميل
                loadingElement.classList.remove('show');
            }
        }

        // التحقق من الكود
        function checkEmployeeCode(code) {
            return employeeCodes.includes(code.trim());
        }

        // جلب معلومات الموظف بناءً على الكود
        async function getUserInfo(code) {
            try {
                let GOOGLE_SCRIPT_URL = localStorage.getItem('googleAppsScriptUrl');
                
                if (!GOOGLE_SCRIPT_URL) {
                    // محاولة جلبه من config.json
                    try {
                        const configRes = await fetch('config.json');
                        const config = await configRes.json();
                        GOOGLE_SCRIPT_URL = config.googleAppsScriptUrl;
                        if (GOOGLE_SCRIPT_URL) {
                            localStorage.setItem('googleAppsScriptUrl', GOOGLE_SCRIPT_URL);
                        }
                    } catch (configError) {
                        console.error('❌ فشل في جلب config.json:', configError);
                    }
                }
                
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('Google Apps Script URL غير موجود');
                }
                
                const url = GOOGLE_SCRIPT_URL + `?type=userInfo&code=${encodeURIComponent(code)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.success && data.data) {
                    return data.data;
                }
            } catch (error) {
                console.error('❌ خطأ في جلب معلومات الموظف:', error);
            }
            return null;
        }

        // معالجة إرسال النموذج
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const code = employeeCodeInput.value.trim();
            
            // التحقق من أن الأكواد تم تحميلها
            if (!isCodesLoaded || employeeCodes.length === 0) {
                errorMessage.textContent = '⚠️ جاري الاتصال بالنظام، يرجى الانتظار...';
                errorMessage.classList.add('show');
                
                // محاولة إعادة التحميل
                await loadEmployeeCodes();
                
                if (!isCodesLoaded) {
                    errorMessage.textContent = '❌ فشل الاتصال بالنظام. يرجى التحقق من الإنترنت';
                    return;
                }
                
                errorMessage.classList.remove('show');
            }
            
            console.log('🔐 محاولة تسجيل الدخول بالكود:', code);
            console.log('📋 الأكواد المتاحة:', employeeCodes);
            console.log('📊 عدد الأكواد:', employeeCodes.length);
            
            // إخفاء رسالة الخطأ
            errorMessage.classList.remove('show');
            
            // إظهار التحميل
            loadingElement.classList.add('show');
            
            // التحقق من الكود
            const isValid = checkEmployeeCode(code);
            console.log('✅ هل الكود صحيح؟', isValid);
            
            if (isValid) {
                console.log('🔍 جاري جلب معلومات الموظف...');
                const userInfo = await getUserInfo(code);
                console.log('👤 معلومات الموظف:', userInfo);
                loadingElement.classList.remove('show');
                
                if (userInfo) {
                    console.log('✅ تم تسجيل الدخول بنجاح!');
                    // الكود صحيح - حفظ البيانات في sessionStorage والانتقال
                    sessionStorage.setItem('employeeCode', code);
                    sessionStorage.setItem('employeeName', userInfo.name || 'موظف');
                    sessionStorage.setItem('isAuthenticated', 'true');
                    window.location.href = 'home.html';
                } else {
                    console.error('❌ فشل في جلب معلومات الموظف');
                    // فشل في جلب معلومات الموظف
                    errorMessage.textContent = '❌ خطأ في جلب معلومات الموظف';
                    errorMessage.classList.add('show');
                    employeeCodeInput.value = '';
                    employeeCodeInput.focus();
                }
            } else {
                // الكود خاطئ
                loadingElement.classList.remove('show');
                errorMessage.textContent = '❌ الكود غير صحيح أو غير مسموح';
                errorMessage.classList.add('show');
                employeeCodeInput.value = '';
                employeeCodeInput.focus();
            }
        });

        // جلب معلومات الموظف بناءً على الكود
        async function getUserInfo(code) {
            try {
                if (!GOOGLE_SCRIPT_URL) {
                    throw new Error('Google Apps Script URL غير موجود');
                }
                
                const url = GOOGLE_SCRIPT_URL + `?type=userInfo&code=${encodeURIComponent(code)}`;
                
                // إضافة timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const res = await fetch(url, {
                    method: 'GET',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!res.ok) {
                    throw new Error(`خطأ في الاتصال: ${res.status}`);
                }
                
                const data = await res.json();
                
                if (data.success && data.data) {
                    return data.data;
                } else {
                    console.warn('⚠️ لم يتم العثور على معلومات الموظف');
                    return null;
                }
            } catch (error) {
                console.error('❌ خطأ في جلب معلومات الموظف:', error);
                return null;
            }
        }

        // تحميل الأكواد عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 بدء تحميل الصفحة...');
            await loadEmployeeCodes();
            
            if (isCodesLoaded) {
                console.log('✅ النظام جاهز - يمكن تسجيل الدخول الآن');
            } else {
                console.warn('⚠️ فشل تحميل الأكواد - يرجى المحاولة مرة أخرى');
            }
        });

        // التركيز على حقل الإدخال عند الضغط على Enter في أي مكان
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement !== employeeCodeInput) {
                employeeCodeInput.focus();
            }
        });
    </script>
</body>
</html>
